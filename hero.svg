<svg width="1200" height="290" viewBox="0 0 1200 290" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050807"/>
      <stop offset="50%" stop-color="#08100C"/>
      <stop offset="100%" stop-color="#0C1712"/>
    </linearGradient>

    <!-- Top Glow Line -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Name Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1E3328" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Editor Header Gradient -->
    <linearGradient id="editorHeaderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111D17"/>
      <stop offset="100%" stop-color="#0C1611"/>
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#172E23" opacity="0.45"/>
    </pattern>

    <style>
      .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .glow-title { filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.3)); }
      .box-glow { filter: drop-shadow(0 4px 24px rgba(0, 0, 0, 0.45)); }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="290" rx="14" fill="url(#bgGrad)"/>
  <rect width="1200" height="290" rx="14" fill="url(#dotGrid)"/>
  <rect x="1" y="1" width="1198" height="288" rx="13" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Accent Glow Ribbon -->
  <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 1186 0 C 1193.73 0 1200 6.27 1200 14 L 1200 3.5 L 0 3.5 Z" fill="url(#accentLine)"/>

  <!-- Ambient Glow Behind Name -->
  <circle cx="220" cy="140" r="130" fill="#10B981" opacity="0.07" filter="blur(40px)"/>

  <!-- ==================== LEFT COLUMN: IDENTITY ==================== -->
  <g transform="translate(48, 38)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#091811" stroke="#10B981" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="13" cy="13" r="4.5" fill="#10B981"/>
    <text x="25" y="17" class="font-mono" font-size="11" font-weight="600" fill="#6EE7B7">B.Tech CSE (3rd Semester)</text>

    <!-- Full Name with Glow -->
    <text x="0" y="74" class="font-sans glow-title" font-size="44" font-weight="900" fill="url(#nameGrad)" letter-spacing="-0.8">Aryansh Sharma</text>

    <!-- Subtitle / Role -->
    <text x="0" y="106" class="font-sans" font-size="17" font-weight="600" fill="#38BDF8">
      Computer Science Undergraduate <tspan fill="#4B6B5E font-weight-400">@</tspan> <tspan fill="#94A3B8">SSIPMT</tspan>
    </text>

    <!-- Core Scope -->
    <text x="0" y="134" class="font-sans" font-size="14" font-weight="400" fill="#94A3B8">
      Focus: <tspan fill="#E2E8F0" font-weight="500">C/C++ · Python · JavaScript · Web Basics · DSA</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="162" class="font-mono" font-size="12.5" font-weight="500" fill="#6EE7B7">
      ✦ Learning by building — depth over breadth.
    </text>

    <!-- Bottom Skill Badges -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="168" height="28" rx="6" fill="#08150F" stroke="#10B981" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="12" cy="14" r="3.5" fill="#10B981"/>
      <text x="22" y="18" class="font-mono" font-size="11" font-weight="600" fill="#D1FAE5">C · C++ · Python · JS</text>

      <rect x="178" y="0" width="140" height="28" rx="6" fill="#08141B" stroke="#06B6D4" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="190" cy="14" r="3.5" fill="#06B6D4"/>
      <text x="200" y="18" class="font-mono" font-size="11" font-weight="600" fill="#CFFAFE">HTML · CSS · React</text>

      <rect x="328" y="0" width="160" height="28" rx="6" fill="#101322" stroke="#6366F1" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="340" cy="14" r="3.5" fill="#818CF8"/>
      <text x="350" y="18" class="font-mono" font-size="11" font-weight="600" fill="#E0E7FF">Practicing DSA in C++</text>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: CODE EDITOR CARD ==================== -->
  <g transform="translate(605, 28)" class="box-glow">
    <!-- Editor Card Background -->
    <rect width="545" height="234" rx="10" fill="#070E0B" stroke="#182B21" stroke-width="1.2"/>

    <!-- Editor Title Bar -->
    <rect width="545" height="34" rx="10" fill="url(#editorHeaderGrad)"/>
    <path d="M 0 24 L 0 34 L 545 34 L 545 24 Z" fill="#0C1611"/>
    <line x1="0" y1="34" x2="545" y2="34" stroke="#182B21" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="18" cy="17" r="5" fill="#EF4444" opacity="0.85"/>
    <circle cx="34" cy="17" r="5" fill="#F59E0B" opacity="0.85"/>
    <circle cx="50" cy="17" r="5" fill="#10B981" opacity="0.85"/>

    <!-- Active File Tab -->
    <rect x="75" y="6" width="165" height="28" rx="5" fill="#070E0B" stroke="#182B21" stroke-width="1"/>
    <text x="88" y="23" class="font-mono" font-size="11.5" font-weight="600" fill="#6EE7B7">student_profile.cpp</text>

    <!-- Secondary Tab -->
    <text x="255" y="23" class="font-mono" font-size="11.5" fill="#4B6B5E">skills.json</text>

    <!-- Code Content -->
    <g transform="translate(20, 56)" class="font-mono" font-size="12">
      <!-- Line 1 -->
      <text x="0" y="0" fill="#3D5A4C">// 3rd Semester CSE Undergraduate @ SSIPMT</text>

      <!-- Line 2 -->
      <text x="0" y="20">
        <tspan fill="#F43F5E">#include</tspan> <tspan fill="#38BDF8">&lt;iostream&gt;</tspan>
      </text>

      <!-- Line 3 -->
      <text x="0" y="42">
        <tspan fill="#F43F5E">struct</tspan> <tspan fill="#FCD34D">Developer</tspan> {
      </text>

      <!-- Line 4 -->
      <text x="18" y="64">
        <tspan fill="#38BDF8">string</tspan> name = <tspan fill="#34D399">"Aryansh Sharma"</tspan>;
      </text>

      <!-- Line 5 -->
      <text x="18" y="86">
        <tspan fill="#38BDF8">string</tspan> college = <tspan fill="#34D399">"SSIPMT (3rd Sem)"</tspan>;
      </text>

      <!-- Line 6 -->
      <text x="18" y="108">
        <tspan fill="#38BDF8">string</tspan> core[] = {<tspan fill="#34D399">"C"</tspan>, <tspan fill="#34D399">"C++"</tspan>, <tspan fill="#34D399">"Python"</tspan>, <tspan fill="#34D399">"JS"</tspan>};
      </text>

      <!-- Line 7 -->
      <text x="18" y="130">
        <tspan fill="#38BDF8">string</tspan> focus = <tspan fill="#34D399">"DSA in C++ &amp; Web Basics"</tspan>;
      </text>

      <!-- Line 8 -->
      <text x="18" y="152">
        <tspan fill="#38BDF8">string</tspan> approach = <tspan fill="#34D399">"Learn by Building"</tspan>;
      </text>

      <!-- Line 9 -->
      <text x="0" y="172">
        };
      </text>
    </g>
  </g>
</svg>