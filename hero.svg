<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <!-- Canvas Background: GitHub Dark (#0d1117) -->
  <rect width="1200" height="260" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Left Column: Identity -->
  <g transform="translate(48, 36)">
    <!-- Academic Badge -->
    <rect x="0" y="0" width="190" height="24" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="10" cy="12" r="3.5" fill="#3FB950"/>
    <text x="20" y="16" class="font-mono" font-size="11" font-weight="500" fill="#8B949E">B.Tech CSE &#183; 3rd Sem</text>

    <!-- Name -->
    <text x="0" y="66" class="font-sans" font-size="34" font-weight="700" fill="#F0F6FC" letter-spacing="-0.3">Aryansh Sharma</text>

    <!-- Role / University -->
    <text x="0" y="96" class="font-sans" font-size="15" font-weight="500" fill="#8B949E">
      Computer Science Undergraduate <tspan fill="#58A6FF">&#183;</tspan> <tspan fill="#C9D1D9">SSIPMT (CSVTU)</tspan>
    </text>

    <!-- Core Languages & Focus -->
    <text x="0" y="122" class="font-sans" font-size="13.5" font-weight="400" fill="#8B949E">
      Core: <tspan fill="#F0F6FC" font-weight="500">C &#183; C++ &#183; Python &#183; JavaScript &#183; HTML / CSS</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="148" class="font-mono" font-size="12" fill="#58A6FF">
      &#8594; Learning by building &#183; Depth over breadth.
    </text>

    <!-- Skill Chips -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="160" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="12" y="17" class="font-mono" font-size="11" fill="#C9D1D9">C &#183; C++ &#183; Python &#183; JS</text>

      <rect x="170" y="0" width="135" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="12" y="17" transform="translate(170, 0)" class="font-mono" font-size="11" fill="#C9D1D9">HTML &#183; CSS &#183; React</text>

      <rect x="315" y="0" width="165" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="12" y="17" transform="translate(315, 0)" class="font-mono" font-size="11" fill="#C9D1D9">Practicing DSA in C++</text>
    </g>
  </g>

  <!-- Right Column: Minimal GitHub Code Card -->
  <g transform="translate(630, 24)">
    <rect width="520" height="212" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>

    <!-- Window Header -->
    <rect width="520" height="32" rx="6" fill="#21262D"/>
    <path d="M 0 24 L 0 32 L 520 32 L 520 24 Z" fill="#21262D"/>
    <line x1="0" y1="32" x2="520" y2="32" stroke="#30363D" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="16" cy="16" r="4.5" fill="#30363D"/>
    <circle cx="30" cy="16" r="4.5" fill="#30363D"/>
    <circle cx="44" cy="16" r="4.5" fill="#30363D"/>

    <!-- Tab Label -->
    <text x="64" y="20" class="font-mono" font-size="11.5" font-weight="500" fill="#8B949E">student.cpp</text>

    <!-- Code Content (GitHub Syntax Highlight Palette) -->
    <g transform="translate(20, 52)" class="font-mono" font-size="11.5">
      <text x="0" y="0" fill="#8B949E">// 2nd Year Computer Science Undergraduate</text>

      <text x="0" y="20">
        <tspan fill="#FF7B72">#include</tspan> <tspan fill="#A5D6FF">&lt;iostream&gt;</tspan>
      </text>

      <text x="0" y="42">
        <tspan fill="#FF7B72">struct</tspan> <tspan fill="#FFA657">Student</tspan> {
      </text>

      <text x="18" y="62">
        <tspan fill="#79C0FF">std::string</tspan> name = <tspan fill="#A5D6FF">"Aryansh Sharma"</tspan>;
      </text>

      <text x="18" y="82">
        <tspan fill="#79C0FF">std::string</tspan> university = <tspan fill="#A5D6FF">"SSIPMT (CSVTU)"</tspan>;
      </text>

      <text x="18" y="102">
        <tspan fill="#79C0FF">std::string</tspan> focus = <tspan fill="#A5D6FF">"C++, DSA &amp; Web Development"</tspan>;
      </text>

      <text x="18" y="122">
        <tspan fill="#79C0FF">std::string</tspan> approach = <tspan fill="#A5D6FF">"Learning by building"</tspan>;
      </text>

      <text x="0" y="142" fill="#C9D1D9">};</text>
    </g>
  </g>
</svg>