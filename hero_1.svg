  <!-- vertical divider -->
  <line x1="640" y1="40" x2="640" y2="220" stroke="#1F2E28" stroke-width="1"/>

  <!-- name -->
  <text x="60" y="108" class="sans" font-size="46" font-weight="700" fill="#F0FDF9">Aryansh Sharma</text>

  <!-- subtitle line -->
  <text x="60" y="140" class="mono" font-size="15" fill="#6EE7B7">$ whoami</text>
  <text x="220" y="140" class="mono" font-size="15" fill="#94A3A0">computer_science_engineering_student</text>

