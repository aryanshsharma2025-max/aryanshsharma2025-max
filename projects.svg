<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#0A0F0D"/>

  <text x="40" y="42" class="mono" font-size="13" fill="#5B6A65">// featured_projects</text>

  <!-- Proofchain card: wider, primary -->
  <g transform="translate(40, 64)">
    <rect x="0" y="0" width="700" height="210" rx="6" fill="#0F1613" stroke="#1F2E28" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="210" fill="#34D399"/>

    <text x="28" y="42" class="sans" font-size="22" font-weight="700" fill="#F0FDF9">Proofchain</text>
    <text x="28" y="64" class="mono" font-size="12" fill="#6EE7B7">document integrity verification</text>

    <text x="28" y="98" class="sans" font-size="13" fill="#B9C4C0">Detects tampering in files by comparing a</text>
    <text x="28" y="118" class="sans" font-size="13" fill="#B9C4C0">SHA-256 fingerprint of the original against</text>
    <text x="28" y="138" class="sans" font-size="13" fill="#B9C4C0">the file's current state — any modification</text>
    <text x="28" y="158" class="sans" font-size="13" fill="#B9C4C0">changes the hash and flags the document.</text>

    <text x="28" y="190" class="mono" font-size="11" fill="#5B6A65">python &middot; hashlib &middot; html/css &middot; git</text>
  </g>

  <!-- Chatbot card: narrower, secondary -->
  <g transform="translate(760, 64)">
    <rect x="0" y="0" width="400" height="210" rx="6" fill="#0F1613" stroke="#1F2E28" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="210" fill="#3F5A50"/>

    <text x="28" y="42" class="sans" font-size="20" font-weight="700" fill="#F0FDF9">Basic-AI-Chatbot</text>
    <text x="28" y="64" class="mono" font-size="12" fill="#7C8B86">python chatbot &middot; learning project</text>

    <text x="28" y="98" class="sans" font-size="13" fill="#B9C4C0">Early Python project exploring</text>
    <text x="28" y="118" class="sans" font-size="13" fill="#B9C4C0">conversational logic and I/O</text>
    <text x="28" y="138" class="sans" font-size="13" fill="#B9C4C0">handling fundamentals.</text>

    <text x="28" y="190" class="mono" font-size="11" fill="#5B6A65">python &middot; git</text>
  </g>
</svg>
