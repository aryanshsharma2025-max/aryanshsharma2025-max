<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .p-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .p-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="280" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <text x="40" y="36" class="p-mono" font-size="12" font-weight="600" fill="#8B949E" letter-spacing="1">// THINGS_IVE_BUILT &#183; PROJECT_SHOWCASE</text>

  <!-- PrepPath AI Card -->
  <g transform="translate(40, 52)">
    <rect width="545" height="200" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    
    <text x="24" y="36" class="p-sans" font-size="18" font-weight="600" fill="#F0F6FC">PrepPath AI</text>
    <rect x="145" y="20" width="85" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1"/>
    <text x="155" y="35" class="p-mono" font-size="10.5" font-weight="500" fill="#58A6FF">LIVE DEMO &#8599;</text>

    <text x="24" y="58" class="p-mono" font-size="11.5" fill="#8B949E">Scholarship &amp; Eligibility Checker</text>

    <text x="24" y="88" class="p-sans" font-size="13" fill="#8B949E">Evaluates student qualifications against opportunity</text>
    <text x="24" y="108" class="p-sans" font-size="13" fill="#8B949E">criteria and flags missing requirements.</text>
    <text x="24" y="128" class="p-sans" font-size="13" fill="#8B949E">Built with Python, FastAPI, React, and Gemini API.</text>

    <rect x="24" y="148" width="497" height="34" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1"/>
    <text x="36" y="170" class="p-mono" font-size="11" fill="#C9D1D9">Python &#183; FastAPI &#183; React &#183; Gemini API &#183; JavaScript</text>
  </g>

  <!-- ProofChain Card -->
  <g transform="translate(615, 52)">
    <rect width="545" height="200" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    
    <text x="24" y="36" class="p-sans" font-size="18" font-weight="600" fill="#F0F6FC">ProofChain</text>
    <rect x="140" y="20" width="85" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1"/>
    <text x="150" y="35" class="p-mono" font-size="10.5" font-weight="500" fill="#3FB950">LIVE DEMO &#8599;</text>

    <text x="24" y="58" class="p-mono" font-size="11.5" fill="#8B949E">Document Verification Prototype</text>

    <text x="24" y="88" class="p-sans" font-size="13" fill="#8B949E">Computes SHA-256 hashes in the browser and records</text>
    <text x="24" y="108" class="p-sans" font-size="13" fill="#8B949E">them on Ethereum testnet to verify file authenticity.</text>
    <text x="24" y="128" class="p-sans" font-size="13" fill="#8B949E">Explores client-side cryptography and smart contracts.</text>

    <rect x="24" y="148" width="497" height="34" rx="4" fill="#21262D" stroke="#30363D" stroke-width="1"/>
    <text x="36" y="170" class="p-mono" font-size="11" fill="#C9D1D9">JavaScript &#183; Solidity &#183; React &#183; Supabase &#183; HTML/CSS</text>
  </g>
</svg>